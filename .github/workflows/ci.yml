name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - feat/gtfs-data-foundation
      - feat/postgres-runtime
      - feat/transit-analytics

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Display Python version
        run: python --version

      - name: Install project and development tools
        run: python -m pip install -c constraints.txt -e ".[dev,dashboard]"

      - name: Run Ruff lint checks
        run: ruff check . --output-format=github

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: |
          mkdir -p evidence
          echo "$GITHUB_SHA" > evidence/tested-sha.txt
          python -m pytest -m "not integration and not browser" --basetemp "${{ runner.temp }}/pytest-offline-${{ github.run_id }}" -o "cache_dir=${{ runner.temp }}/pytest-cache-offline" --junitxml=evidence/offline-tests.xml
      - name: Save offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  postgres:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wta_test
          POSTGRES_USER: wta_test_admin
          # Disposable CI service credential, never used outside this job.
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wta_test_admin -d wta_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: "host=127.0.0.1 port=5432 dbname=wta_test user=wta_test_admin password=ci_test_only"
      WTA_REQUIRE_INTEGRATION: "1"
      WTA_EVIDENCE_DIR: evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -c constraints.txt -e ".[dev,dashboard]"
      - name: Record tested SHA and PostgreSQL image digest
        run: |
          mkdir -p evidence
          echo "$GITHUB_SHA" > evidence/tested-sha.txt
          docker image inspect postgres:17 --format '{{json .RepoDigests}}' > evidence/postgres-image-digest.json
      - name: Run real PostgreSQL cases
        run: >-
          python -m pytest -m integration
          --basetemp "${{ runner.temp }}/pytest-postgres-${{ github.run_id }}"
          -o "cache_dir=${{ runner.temp }}/pytest-cache-postgres"
          --junitxml=evidence/postgres-tests.xml
      - name: Verify actual execution with no integration skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/postgres-tests.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) >= 23, 'Expected actual loader, gold and reader/dashboard cases'
          assert not root.findall('.//skipped'), 'Integration skips are forbidden'
          assert not root.findall('.//failure') and not root.findall('.//error')
          print(f'Executed {len(cases)} PostgreSQL integration cases without skips')
          PY
      - name: Save PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  compose:
    name: Docker build and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: wta-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "15433"
      DASHBOARD_PORT: "18501"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python for live UI verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser verification tools
        run: |
          python -m pip install -c constraints.txt -e '.[dev,dashboard,ui-test]'
          python -m playwright install --with-deps chromium
      - name: Configure disposable project credentials and input directory
        run: |
          admin_password=$(openssl rand -hex 24)
          loader_password=$(openssl rand -hex 24)
          reader_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$loader_password"
          echo "::add-mask::$reader_password"
          echo "POSTGRES_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "WTA_LOADER_PASSWORD=$loader_password" >> "$GITHUB_ENV"
          echo "WTA_READER_PASSWORD=$reader_password" >> "$GITHUB_ENV"
          echo "SILVER_DIR=$RUNNER_TEMP/wta-silver-input" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/wta-silver-input" evidence
          echo "$GITHUB_SHA" > evidence/tested-sha.txt
      - name: Build the application image
        run: |
          docker pull python:3.12-slim
          docker compose --profile tools build
          docker image inspect "$COMPOSE_PROJECT_NAME-pipeline" --format '{{.Id}}' > evidence/application-image-id.txt
      - name: Start healthy PostgreSQL and record images
        run: |
          docker compose up -d --wait postgres
          docker image inspect postgres:17 --format '{{json .RepoDigests}}' > evidence/postgres-image-digest.json
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}' > evidence/python-image-digest.json
      - name: Initialize twice without resetting data
        run: |
          docker compose run --rm initializer db-init --loader-role wta_loader --reader-role wta_reader --json | tee evidence/init-first.json
          docker compose run --rm initializer db-init --loader-role wta_loader --reader-role wta_reader --json | tee evidence/init-second.json
          grep -q UP_TO_DATE evidence/init-second.json
      - name: Generate demo then prepare load and analyze through the real CLI
        run: |
          docker compose run --rm --env WTA_SMOKE_REQUIRE_NEW=1 --entrypoint python pipeline /app/scripts/compose_smoke.py | tee evidence/compose-smoke.json
      - name: Start installed non-root Streamlit and verify real UI
        env:
          WTA_BROWSER_URL: http://127.0.0.1:18501
          WTA_BROWSER_EXPECTED: evidence/compose-smoke.json
          WTA_BROWSER_EVIDENCE: evidence/screenshots
        run: |
          docker compose up -d --wait dashboard
          docker compose exec -T dashboard id -u | tee evidence/dashboard-uid.txt
          grep -q 10001 evidence/dashboard-uid.txt
          python -m pytest tests/ui/test_browser.py tests/ui/test_raster_browser.py -m browser --basetemp "$RUNNER_TEMP/browser-$GITHUB_RUN_ID" --junitxml=evidence/browser-tests.xml
      - name: Restart PostgreSQL and verify named-volume persistence
        run: |
          docker compose restart postgres dashboard
          docker compose up -d --wait postgres dashboard
          docker compose run --rm --entrypoint python pipeline -c 'import os, psycopg; c=psycopg.connect(os.environ["DATABASE_URL"]); d=c.execute("SELECT count(*) FROM meta.datasets WHERE status=\x27complete\x27").fetchone()[0]; a=c.execute("SELECT count(*) FROM meta.analyses WHERE status=\x27complete\x27").fetchone()[0]; g=c.execute("SELECT count(*) FROM gold.route_daily").fetchone()[0]; assert (d,a,g)==(1,1,14); print("Restart persistence PASS: 1 dataset, 1 analysis, 14 route_daily rows")' | tee evidence/restart.txt
      - name: Verify UI after restart and preserved gold
        env:
          WTA_BROWSER_URL: http://127.0.0.1:18501
          WTA_BROWSER_EXPECTED: evidence/compose-smoke.json
          WTA_BROWSER_EVIDENCE: evidence/after-restart
        run: python -m pytest tests/ui/test_browser.py tests/ui/test_raster_browser.py -m browser --basetemp "$RUNNER_TEMP/browser-restart-$GITHUB_RUN_ID" --junitxml=evidence/browser-restart-tests.xml
      - name: Prepare two disjoint explicitly synthetic snapshots through the existing pipeline
        run: |
          docker compose run --rm --env WTA_BROWSER_FIXTURE_PROJECT=1 --entrypoint python pipeline /app/scripts/browser_fixtures.py > evidence/browser-fixtures.json
          docker compose restart dashboard
          docker compose up -d --wait dashboard
      - name: Mandatory browser regression of snapshot state and existing demo UI
        env:
          WTA_BROWSER_URL: http://127.0.0.1:18501
          WTA_BROWSER_EXPECTED: evidence/compose-smoke.json
          WTA_BROWSER_FIXTURES: evidence/browser-fixtures.json
          WTA_REQUIRE_SNAPSHOT_BROWSER: "1"
          WTA_BROWSER_EVIDENCE: evidence/two-snapshots
        run: |
          python -m pytest tests/ui/test_snapshot_browser.py tests/ui/test_browser.py tests/ui/test_raster_browser.py -m browser --basetemp "$RUNNER_TEMP/browser-snapshots-$GITHUB_RUN_ID" --junitxml=evidence/snapshot-browser-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/snapshot-browser-tests.xml').getroot()
          cases = root.findall('.//testcase')
          regression = [c for c in cases if c.get('name') == 'test_disjoint_snapshots_visible_day_sql_course_filters_views_and_reload']
          assert len(regression) == 1, 'Mandatory two-snapshot browser regression must execute'
          assert len(cases) == 3, 'Expected snapshot, existing demo and enabled raster cases'
          assert not root.findall('.//skipped'), 'Mandatory Compose browser cases cannot skip'
          assert not root.findall('.//failure') and not root.findall('.//error')
          print(f'Executed {len(cases)} mandatory Compose browser cases without skips')
          PY
      - name: Restart and verify all three isolated test snapshots persist
        run: |
          docker compose restart postgres dashboard
          docker compose up -d --wait postgres dashboard
          docker compose run --rm --env WTA_BROWSER_FIXTURE_PROJECT=1 --entrypoint python pipeline /app/scripts/browser_fixtures.py --verify /work/browser-fixtures.json > evidence/snapshot-restart.json
      - name: Mandatory snapshot browser regression after restart
        env:
          WTA_BROWSER_URL: http://127.0.0.1:18501
          WTA_BROWSER_EXPECTED: evidence/compose-smoke.json
          WTA_BROWSER_FIXTURES: evidence/browser-fixtures.json
          WTA_REQUIRE_SNAPSHOT_BROWSER: "1"
          WTA_BROWSER_EVIDENCE: evidence/two-snapshots-after-restart
        run: |
          python -m pytest tests/ui/test_snapshot_browser.py tests/ui/test_browser.py tests/ui/test_raster_browser.py -m browser --basetemp "$RUNNER_TEMP/browser-snapshots-restart-$GITHUB_RUN_ID" --junitxml=evidence/snapshot-browser-restart-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/snapshot-browser-restart-tests.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 3
          assert sum(c.get('name') == 'test_disjoint_snapshots_visible_day_sql_course_filters_views_and_reload' for c in cases) == 1
          assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
          PY
      - name: Stop only this unique test project, retaining named volumes
        if: always()
        run: docker compose down --remove-orphans
      - name: Save build and Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  portfolio:
    name: Portable demo · native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: wta-portfolio-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      WTA_PORTFOLIO_URL: http://127.0.0.1:8504
      WTA_PORTFOLIO_EXPECTED: evidence/portfolio-first.json
      WTA_PORTFOLIO_EVIDENCE: evidence/portfolio-browser
      WTA_REQUIRE_PORTFOLIO_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python for acceptance tests
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install browser acceptance tools
        run: |
          python -m pip install -c constraints.txt -e '.[dev,dashboard,ui-test]'
          python -m playwright install --with-deps chromium
      - name: Export the exact commit without author files or Git metadata
        run: |
          mkdir -p evidence
          echo "$GITHUB_SHA" > evidence/tested-sha.txt
          fresh_directory="$RUNNER_TEMP/Portfolio fresh source"
          mkdir "$fresh_directory"
          # Git archive exports only versioned files at the tested commit.
          git archive "$GITHUB_SHA" | tar -x -C "$fresh_directory"
          test ! -e "$fresh_directory/.git"
          test ! -e "$fresh_directory/.env"
          test ! -e "$fresh_directory/.venv"
          # The repository tracks only a .gitkeep scaffold here, never author data.
          if [ -d "$fresh_directory/data/raw" ]; then
            test -z "$(find "$fresh_directory/data/raw" -type f ! -name .gitkeep -print -quit)"
          fi
          test ! -e "$fresh_directory/output"
          echo "PORTFOLIO_SOURCE=$fresh_directory" >> "$GITHUB_ENV"
          uname -m | tee evidence/host-machine.txt
          test "$(uname -m)" = '${{ matrix.machine }}'
          docker version > evidence/docker-version.txt
          docker compose version > evidence/compose-version.txt
      - name: Run the documented command in the fresh source directory
        run: |
          cd "$PORTFOLIO_SOURCE"
          docker compose -f compose.demo.yaml config --format json > "$GITHUB_WORKSPACE/evidence/compose-resolved.json"
          docker compose -f compose.demo.yaml up --build -d --wait 2>&1 | tee "$GITHUB_WORKSPACE/evidence/fresh-start.log"
          docker compose -f compose.demo.yaml ps --all --format json > "$GITHUB_WORKSPACE/evidence/services-first.json"
          docker image inspect wta-portfolio-app postgres:17 --format '{"id":"{{.Id}}","architecture":"{{.Architecture}}","os":"{{.Os}}","repo_digests":{{json .RepoDigests}}}' > "$GITHUB_WORKSPACE/evidence/native-images.jsonl"
          # BuildKit need not load its base image into the daemon's local tags.
          docker buildx imagetools inspect python:3.12-slim > "$GITHUB_WORKSPACE/evidence/python-base-manifest.txt"
          docker compose -f compose.demo.yaml exec -T dashboard python -m pip check > "$GITHUB_WORKSPACE/evidence/dependency-check.txt"
          docker compose -f compose.demo.yaml exec -T dashboard python -m pip freeze > "$GITHUB_WORKSPACE/evidence/installed-dependencies.txt"
          docker compose -f compose.demo.yaml exec -T dashboard python /app/scripts/portfolio_verify.py --credential-file /run/secrets/reader/password > "$GITHUB_WORKSPACE/evidence/portfolio-first.json"
      - name: Verify actual native runtime, packaged data, privileges and network scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('evidence/portfolio-first.json').read_text())
          assert proof['status'] == 'PASSED'
          assert proof['native_runtime']['machine'] == '${{ matrix.machine }}'
          assert proof['native_runtime']['uid'] == 10001
          config = json.loads(Path('evidence/compose-resolved.json').read_text())
          assert not config['services']['postgres'].get('ports')
          assert all(p['host_ip'] == '127.0.0.1' for p in config['services']['dashboard']['ports'])
          assert proof['default']['shape_points'] > 0 and proof['late']['end_seconds'] >= 86400
          print('Native imports, real prepare/load/analyze/shapes, reader grants and loopback-only dashboard PASS')
          PY
      - name: Verify the real UI with local map fixtures
        run: >-
          python -m pytest tests/ui/test_portfolio_browser.py -m browser
          --basetemp "$RUNNER_TEMP/portfolio-browser-${{ matrix.arch }}"
          --junitxml=evidence/portfolio-browser-tests.xml
      - name: Repeat the exact command and restart without deleting volumes
        run: |
          cd "$PORTFOLIO_SOURCE"
          docker compose -f compose.demo.yaml up --build -d --wait 2>&1 | tee "$GITHUB_WORKSPACE/evidence/repeat-start.log"
          docker compose -f compose.demo.yaml exec -T dashboard python /app/scripts/portfolio_verify.py --credential-file /run/secrets/reader/password > "$GITHUB_WORKSPACE/evidence/portfolio-repeat.json"
          docker compose -f compose.demo.yaml restart postgres dashboard
          docker compose -f compose.demo.yaml up --build -d --wait 2>&1 | tee "$GITHUB_WORKSPACE/evidence/restart-start.log"
          docker compose -f compose.demo.yaml exec -T dashboard python /app/scripts/portfolio_verify.py --credential-file /run/secrets/reader/password > "$GITHUB_WORKSPACE/evidence/portfolio-restart.json"
      - name: Confirm persistence and execute the UI after restart
        env:
          WTA_PORTFOLIO_EVIDENCE: evidence/portfolio-browser-after-restart
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(Path(f'evidence/portfolio-{stage}.json').read_text()) for stage in ('first','repeat','restart')]
          for current in reports[1:]:
              assert current == reports[0], 'Dataset, analysis, shapes, calendar, KPIs and reader must persist exactly'
          print('Repeat and restart preserve the complete isolated sample and authenticated reader')
          PY
          python -m pytest tests/ui/test_portfolio_browser.py -m browser --basetemp "$RUNNER_TEMP/portfolio-browser-restart-${{ matrix.arch }}" --junitxml=evidence/portfolio-browser-restart-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('portfolio-browser-tests.xml','portfolio-browser-restart-tests.xml'):
              root = ET.parse('evidence/' + name).getroot()
              assert root.findall('.//testcase'), 'Actual portfolio browser tests must execute'
              assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
          PY
      - name: Reject a preserved database with missing matching credentials
        run: |
          cd "$PORTFOLIO_SOURCE"
          if docker compose -f compose.demo.yaml run --rm --no-deps -v "${COMPOSE_PROJECT_NAME}_missing_reader:/run/secrets/reader" config > "$GITHUB_WORKSPACE/evidence/missing-credentials-guard.log" 2>&1; then
            echo 'Configuration loss must fail rather than regenerate passwords'
            exit 1
          fi
          grep -q DEMO_CONFIG_LOST "$GITHUB_WORKSPACE/evidence/missing-credentials-guard.log"
          docker compose -f compose.demo.yaml exec -T dashboard python /app/scripts/portfolio_verify.py --credential-file /run/secrets/reader/password > "$GITHUB_WORKSPACE/evidence/portfolio-after-config-guard.json"
          cmp "$GITHUB_WORKSPACE/evidence/portfolio-first.json" "$GITHUB_WORKSPACE/evidence/portfolio-after-config-guard.json"
      - name: Retain useful logs and stop only this test project
        if: always()
        run: |
          if [ -n "${PORTFOLIO_SOURCE:-}" ]; then
            cd "$PORTFOLIO_SOURCE"
            docker compose -f compose.demo.yaml logs --no-color --tail 80 > "$GITHUB_WORKSPACE/evidence/services.log" 2>&1 || true
            docker compose -f compose.demo.yaml stop
          fi
      - name: Save native architecture acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ matrix.arch }}-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
