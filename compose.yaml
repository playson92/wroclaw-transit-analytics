services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wta
      POSTGRES_USER: wta_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      WTA_LOADER_PASSWORD: ${WTA_LOADER_PASSWORD:?Set WTA_LOADER_PASSWORD locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/bootstrap-loader.sh:/docker-entrypoint-initdb.d/10-loader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wta_admin -d wta"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  initializer:
    build: .
    profiles: [tools]
    entrypoint: [python, -m, wroclaw_transit_analytics]
    command: [db-init, --loader-role, wta_loader, --reader-role, wta_reader]
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=wta user=wta_admin"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      WTA_READER_PASSWORD: ${WTA_READER_PASSWORD:?Set WTA_READER_PASSWORD locally}
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    profiles: [tools]
    entrypoint: [python, -m, wroclaw_transit_analytics]
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=wta user=wta_loader"
      PGPASSWORD: ${WTA_LOADER_PASSWORD:?Set WTA_LOADER_PASSWORD locally}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pipeline_work:/work
      - type: bind
        source: ${SILVER_DIR:-./data/silver}
        target: /input/silver
        read_only: true
        bind:
          create_host_path: false

  dashboard:
    build: .
    command: [python, -m, wroclaw_transit_analytics, dashboard, --address, "0.0.0.0"]
    environment:
      READONLY_DATABASE_URL: "host=postgres port=5432 dbname=wta user=wta_reader password=${WTA_READER_PASSWORD:?Set WTA_READER_PASSWORD locally}"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  pipeline_work:
