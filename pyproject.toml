[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wroclaw-transit-analytics"
version = "0.2.0"
description = "Local-first platform for processing and analysing public transport data from Wroclaw."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Jonatan Tomaszewicz" }]
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1,<26",
    "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.57,<1.58"]
ui-test = ["playwright>=1.63,<1.64"]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "setuptools>=80",
    "wheel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wroclaw_transit_analytics.database" = ["sql/*.sql"]
"wroclaw_transit_analytics.analytics" = ["sql/*.sql"]
"wroclaw_transit_analytics.dashboard" = ["sql/*.sql", ".streamlit/config.toml"]
"wroclaw_transit_analytics.portfolio" = ["assets/*.zip", "assets/*.json", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["integration: requires a dedicated PostgreSQL 17 TEST_DATABASE_URL", "browser: live Streamlit and PostgreSQL browser evidence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
